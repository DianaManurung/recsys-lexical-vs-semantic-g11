<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Recommendation Methods Overview</title>
  <desc id="desc">A visual summary of the shared recommendation pipeline, three implemented baselines, and the planned semantic embedding model.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#172554" flood-opacity=".10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
      .muted { fill: #64748b; }
      .small { font-size: 14px; }
      .body { font-size: 16px; }
      .card { fill: #fff; stroke: #dbe3f0; stroke-width: 1.5; }
      .label { font-size: 12px; font-weight: 700; letter-spacing: 1.1px; }
    </style>
  </defs>

  <rect width="1200" height="900" rx="28" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="170" rx="28" fill="url(#header)"/>
  <rect x="0" y="140" width="1200" height="30" fill="url(#header)"/>
  <text x="64" y="62" fill="#c7d2fe" font-size="14" font-weight="700" letter-spacing="2">RECOMMENDER SYSTEMS</text>
  <text x="64" y="108" fill="#ffffff" font-size="36" font-weight="750">Method Overview</text>
  <text x="64" y="140" fill="#dbeafe" font-size="17">Lexical vs. semantic item representations</text>
  <rect x="930" y="54" width="210" height="38" rx="19" fill="#dcfce7"/>
  <circle cx="951" cy="73" r="6" fill="#16a34a"/>
  <text x="967" y="78" fill="#166534" font-size="13" font-weight="700">3 IMPLEMENTED BASELINES</text>

  <text x="64" y="214" class="label muted">SHARED RECOMMENDATION PIPELINE</text>

  <g filter="url(#shadow)">
    <rect x="64" y="236" width="270" height="104" rx="16" class="card"/>
    <rect x="354" y="236" width="270" height="104" rx="16" class="card"/>
    <rect x="644" y="236" width="270" height="104" rx="16" class="card"/>
    <rect x="934" y="236" width="202" height="104" rx="16" class="card"/>
  </g>
  <circle cx="96" cy="269" r="15" fill="#dbeafe"/>
  <text x="96" y="275" text-anchor="middle" fill="#1d4ed8" font-size="15" font-weight="700">1</text>
  <text x="122" y="273" font-size="17" font-weight="700">Training interactions</text>
  <text x="88" y="305" class="small muted">Ratings, user history, item popularity</text>
  <text x="88" y="326" class="small muted">Rating ≥ 4 counts as positive</text>

  <path d="M337 288h13" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="386" cy="269" r="15" fill="#e0e7ff"/>
  <text x="386" y="275" text-anchor="middle" fill="#4338ca" font-size="15" font-weight="700">2</text>
  <text x="412" y="273" font-size="17" font-weight="700">Fit from train</text>
  <text x="378" y="305" class="small muted">Interaction models learn from train</text>
  <text x="378" y="326" class="small muted">TF-IDF fits candidate item text</text>

  <path d="M627 288h13" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="676" cy="269" r="15" fill="#fef3c7"/>
  <text x="676" y="275" text-anchor="middle" fill="#b45309" font-size="15" font-weight="700">3</text>
  <text x="702" y="273" font-size="17" font-weight="700">Warm candidates</text>
  <text x="668" y="305" class="small muted">Rank items in candidate set C</text>
  <text x="668" y="326" class="small muted">Exclude items seen in training</text>

  <path d="M917 288h13" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="965" cy="269" r="15" fill="#dcfce7"/>
  <text x="965" y="275" text-anchor="middle" fill="#15803d" font-size="15" font-weight="700">4</text>
  <text x="991" y="273" font-size="17" font-weight="700">Top-10</text>
  <text x="958" y="305" class="small muted">Up to 10 items</text>
  <text x="958" y="326" class="small muted">per user</text>

  <text x="64" y="390" class="label muted">RANKING METHODS</text>
  <g filter="url(#shadow)">
    <rect x="64" y="412" width="252" height="220" rx="18" class="card"/>
    <rect x="332" y="412" width="252" height="220" rx="18" class="card"/>
    <rect x="600" y="412" width="252" height="220" rx="18" class="card"/>
  </g>
  <rect x="84" y="432" width="105" height="25" rx="12.5" fill="#dcfce7"/>
  <text x="136" y="449" text-anchor="middle" class="label" fill="#166534">IMPLEMENTED</text>
  <text x="84" y="490" font-size="22" font-weight="750">Popularity</text>
  <text x="84" y="523" class="body">Score = count of positive</text>
  <text x="84" y="547" class="body">training interactions.</text>
  <text x="84" y="584" class="small muted">Same ranked list for users;</text>
  <text x="84" y="605" class="small muted">seen items are filtered out.</text>

  <rect x="352" y="432" width="105" height="25" rx="12.5" fill="#dcfce7"/>
  <text x="404" y="449" text-anchor="middle" class="label" fill="#166534">IMPLEMENTED</text>
  <text x="352" y="490" font-size="22" font-weight="750">Matrix factorization</text>
  <text x="352" y="523" class="body">Biased rating prediction:</text>
  <text x="352" y="550" font-size="17" font-weight="650">mean + user/item bias</text>
  <text x="352" y="575" font-size="17" font-weight="650">+ latent-factor dot product</text>
  <text x="352" y="606" class="small muted">32 factors · 10 epochs · SGD</text>

  <rect x="620" y="432" width="105" height="25" rx="12.5" fill="#dcfce7"/>
  <text x="672" y="449" text-anchor="middle" class="label" fill="#166534">IMPLEMENTED</text>
  <text x="620" y="490" font-size="22" font-weight="750">Lexical TF-IDF</text>
  <text x="620" y="523" class="body">Mean profile from positive</text>
  <text x="620" y="547" class="body">train items; rank by item/profile</text>
  <text x="620" y="571" class="body">vector dot product.</text>
  <text x="620" y="605" class="small muted">Unigrams · English stop words</text>

  <g filter="url(#shadow)">
    <rect x="868" y="412" width="268" height="220" rx="18" fill="#fff" stroke="#a5b4fc" stroke-width="2" stroke-dasharray="8 6"/>
  </g>
  <rect x="888" y="432" width="124" height="25" rx="12.5" fill="#eef2ff"/>
  <text x="950" y="449" text-anchor="middle" class="label" fill="#4338ca">NOT IN CODE</text>
  <text x="888" y="490" font-size="22" font-weight="750">Semantic embeddings</text>
  <text x="888" y="523" class="body">Sentence vectors capture</text>
  <text x="888" y="547" class="body">meaning beyond exact word</text>
  <text x="888" y="571" class="body">overlap; use same user-profile</text>
  <text x="888" y="595" class="body">and candidate-ranking protocol.</text>
  <text x="888" y="619" class="small muted">Planned comparison in paper</text>

  <rect x="64" y="666" width="1072" height="160" rx="20" fill="#fff" stroke="#dbe3f0" stroke-width="1.5"/>
  <text x="90" y="703" class="label muted">VALIDATION &amp; REPORTING</text>
  <line x1="600" y1="720" x2="600" y2="802" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="103" cy="749" r="7" fill="#6366f1"/>
  <text x="123" y="755" font-size="17" font-weight="700">Validation split</text>
  <text x="90" y="784" class="body muted">Used to measure ranking quality; not used to fit model parameters.</text>
  <circle cx="638" cy="749" r="7" fill="#0ea5e9"/>
  <text x="658" y="755" font-size="17" font-weight="700">Metrics</text>
  <text x="638" y="784" class="body muted">Recall@10 · NDCG@10 · HitRate@10</text>
  <text x="64" y="864" class="small muted">Scope note: the current repository implements Popularity, MF, and TF-IDF CBF; semantic embeddings are shown as a planned extension.</text>
</svg>
